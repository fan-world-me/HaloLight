name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Определяем следующую версию.
      # Мажор всегда 2. Минор всегда 0.
      # Patch = последний patch из релизов + 1, минимум 1.
      # Пример: последний релиз 1.0.7 → следующий 2.0.1
      #         последний релиз 2.0.3 → следующий 2.0.4
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Получаем список всех релизов и ищем максимальный patch среди 2.0.X
          # Если 2.0.X релизов ещё нет — patch будет 0, и мы поставим 1
          LATEST_20_PATCH=$(gh release list --limit 50 --json tagName \
            -q '[.[].tagName | ltrimstr("v") | select(startswith("2.0.")) | ltrimstr("2.0.") | tonumber] | max // 0')

          NEXT_PATCH=$((LATEST_20_PATCH + 1))
          # Минимум 1
          if [ "$NEXT_PATCH" -lt 1 ]; then
            NEXT_PATCH=1
          fi

          VERSION_NAME="2.0.${NEXT_PATCH}"
          VERSION_CODE="$NEXT_PATCH"

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет KEYSTORE_BASE64 не задан (Settings → Secrets and variables → Actions)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "HaloLight-v${VERSION_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_NAME}" "HaloLight-v${VERSION_NAME}.apk" \
            --title "HaloLight v${VERSION_NAME}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
